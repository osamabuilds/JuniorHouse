<!-- @dsCard group="Forms" height=520 subtitle="Input, error, search, newsletter, sort" -->
<style>body{margin:0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.cap{font:500 11px/16px var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px}.fr{border:1px solid var(--line-strong);overflow:hidden;background:var(--surface);color:var(--ink)}.two{display:flex;gap:40px;align-items:flex-start}</style>
<div class="rp-root" style="padding:0px"><div class="rp-vp"><div style="padding:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;max-width:1000px">
<div class="rp-field"><label class="rp-label" for="a">Mobile number</label><input id="a" class="rp-input" placeholder="0300 1234567" autocomplete="tel"><p class="rp-help">We text delivery updates only.</p></div>
<div class="rp-field"><label class="rp-label" for="b">Mobile number</label><input id="b" class="rp-input" aria-invalid="true" aria-describedby="b-e" value="0300 123"><p id="b-e" class="rp-error"><svg class="rp-ico" viewBox="0 0 24 24" aria-hidden="true" ><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.1"/></svg><span>Enter 11 digits, for example 0300 1234567.</span></p></div>
<div class="rp-field"><span class="rp-label">Header search</span><form class="rp-search" role="search" style="display:flex"><svg class="rp-ico" viewBox="0 0 24 24" aria-hidden="true" ><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input type="search" placeholder="Search dresses, shirts, gifts" aria-label="Search"></form></div>
<div class="rp-field"><label class="rp-label" for="s">Sort</label><select id="s" class="rp-select"><option>Featured</option><option>Newest</option><option>Price, low to high</option></select></div>
<div class="rp-field" style="grid-column:1/-1"><label class="rp-label" for="n">Newsletter</label><div class="rp-group"><input id="n" class="rp-input" type="email" placeholder="Your email"><button class="rp-btn" type="button">Join</button></div></div></div></div></div>
