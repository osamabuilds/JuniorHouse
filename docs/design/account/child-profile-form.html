<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Add Child Profile</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3,p,ul{margin:0;padding:0}ul{list-style:none}a{color:inherit;text-decoration:none}
label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.field{width:100%;min-height:52px;padding:0 14px;border:1px solid #000;border-radius:2px;background:#fff;font:inherit;color:#000;box-sizing:border-box}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;border-radius:999px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #000;outline-offset:3px}
</style>
<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#fff">
  <div style="position:absolute;inset:0;padding:64px"><p style="font-size:64px;line-height:.98;font-weight:600;letter-spacing:-.03em">Child profiles</p></div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.45)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="dt" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;background:#fff;padding:40px;box-sizing:border-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><h2 id="dt" style="font-size:32px;line-height:1.05;font-weight:600;letter-spacing:-.03em">Add a child</h2><button type="button" aria-label="Close" style="width:44px;height:44px;margin:-8px -12px 0 0;border:0;background:none;color:#000;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p style="color:#4D4D4D;margin-bottom:28px">Only you can see this profile. You can edit or delete it at any time.</p>
    <form style="display:grid;gap:20px" aria-label="Add a child">
      <div><label for="n">Name</label><input id="n" class="field" type="text"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label for="m">Birth month</label><select id="m" class="field"><option>Month</option></select></div><div><label for="y">Birth year</label><select id="y" class="field"><option>Year</option></select></div></div>
      <div><label for="s">Usual size <span style="font-weight:400;color:#4D4D4D">(optional)</span></label><select id="s" class="field"><option>Not sure yet</option><option>2–3 Y</option><option>4–5 Y</option><option>6–7 Y</option><option>8–9 Y</option><option>10–12 Y</option></select></div>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px"><button type="button" class="pill" style="border:1px solid #000;background:none;color:#000">Cancel</button><button type="submit" class="pill" style="border:0;background:#D9A62E;color:#000">Save profile</button></div>
    </form>
    <p style="margin-top:24px;padding-top:20px;border-top:1px solid #E6E6E6;font-size:13px;color:#4D4D4D">Deleting a profile does not affect your past orders.</p>
  </section>
</div>
</body>
</html>
