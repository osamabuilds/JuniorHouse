<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Account Mobile</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,p,ul{margin:0;padding:0}ul{list-style:none}a{color:inherit;text-decoration:none}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;min-height:60px;border-bottom:1px solid #E6E6E6;font-size:17px;font-weight:600}
.tag{display:inline-block;padding:2px 12px;border:1px solid #000;border-radius:999px;font-size:12px;font-weight:600;background:#000;color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:-2px}
</style>
<div style="width:100%;max-width:480px;margin:0 auto">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 4px;border-bottom:1px solid #E6E6E6">
    <button type="button" aria-label="Open menu" style="width:48px;height:48px;border:0;background:none;color:#000"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    <a href="../core-pages/home-mobile.html" style="font-size:26px;font-weight:600;letter-spacing:-.04em">romp kids</a>
    <button type="button" aria-label="Bag, 3 items" style="width:48px;height:48px;border:0;background:none;color:#000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
  </header>
  <main style="padding:0 20px 64px">
    <div style="padding:32px 0 24px"><p class="eyebrow" style="margin-bottom:8px">My account</p><h1 style="font-size:36px;line-height:1;font-weight:600;letter-spacing:-.03em">Hello, [First name]</h1></div>
    <section aria-labelledby="lo" style="border:1px solid #000;padding:20px;margin-bottom:28px">
      <h2 id="lo" class="eyebrow" style="margin-bottom:10px">Latest order</h2>
      <p style="font-weight:600;font-size:17px">Order [ORDER NUMBER]</p><p style="color:#4D4D4D;margin-bottom:12px">Placed [date] · Rs. 18,100</p>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">Shipped</span><a href="../core-pages/home-mobile.html" style="font-weight:600;border-bottom:1px solid #000;padding:8px 0">Track order</a></div>
    </section>
    <nav aria-label="Account"><ul style="border-top:1px solid #E6E6E6">
      <li><a class="row" href="../core-pages/home-mobile.html">Orders <span aria-hidden="true">→</span></a></li>
      <li><a class="row" href="../core-pages/home-mobile.html">Addresses <span aria-hidden="true">→</span></a></li>
      <li><a class="row" href="child-profiles-mobile.html">Child profiles <span aria-hidden="true">→</span></a></li>
      <li><a class="row" href="../core-pages/home-mobile.html">Wishlist <span aria-hidden="true">→</span></a></li>
      <li><a class="row" href="../core-pages/home-mobile.html">Your details <span aria-hidden="true">→</span></a></li>
    </ul></nav>
    <p style="margin-top:28px"><a href="../core-pages/home-mobile.html" style="display:inline-block;padding:12px 0;font-weight:600;text-decoration:underline;text-underline-offset:4px">Sign out</a></p>
  </main>
</div>
</body>
</html>
