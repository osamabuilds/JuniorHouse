<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Menu Mobile</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 20px;border-bottom:1px solid #E6E6E6;font-size:18px;font-weight:600;width:100%;box-sizing:border-box;background:none;border-left:0;border-right:0;border-top:0;font-family:inherit;color:#000;text-align:left}
.sub a{display:block;padding:12px 0;font-size:15px;font-weight:400}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:-2px}
</style>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#fff;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 4px;border-bottom:1px solid #E6E6E6">
    <button type="button" aria-label="Close menu" style="width:48px;height:48px;border:0;background:none;color:#000"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <a href="menu-mobile.html" style="font-size:26px;font-weight:600;letter-spacing:-.04em">romp kids</a>
    <button type="button" aria-label="Bag, 0 items" style="width:48px;height:48px;border:0;background:none;color:#000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
  </header>

  <nav aria-label="Primary" style="flex:1;overflow:auto">
    <ul>
      <li><a class="row" href="menu-mobile.html">New in</a></li>
      <li>
        <button type="button" class="row" aria-expanded="true" aria-controls="girls-sub" style="border-bottom:0">Girls
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div id="girls-sub" class="sub" style="padding:0 20px 24px;border-bottom:1px solid #E6E6E6">
          <a href="menu-mobile.html" style="font-weight:600">Shop all girls</a>
          <p class="eyebrow" style="margin:16px 0 4px;color:#4D4D4D">Category</p>
          <ul>
            <li><a href="menu-mobile.html">Dresses</a></li>
            <li><a href="menu-mobile.html">Tops &amp; shirts</a></li>
            <li><a href="menu-mobile.html">Knitwear</a></li>
            <li><a href="menu-mobile.html">Bottoms</a></li>
            <li><a href="menu-mobile.html">Outerwear</a></li>
          </ul>
          <p class="eyebrow" style="margin:16px 0 8px;color:#4D4D4D">Age</p>
          <ul style="display:flex;flex-wrap:wrap;gap:8px">
            <li><a href="menu-mobile.html" style="padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border:1px solid #E6E6E6;border-radius:999px;font-weight:600;font-size:14px">2–3 Y</a></li>
            <li><a href="menu-mobile.html" style="padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border:1px solid #E6E6E6;border-radius:999px;font-weight:600;font-size:14px">4–5 Y</a></li>
            <li><a href="menu-mobile.html" style="padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border:1px solid #E6E6E6;border-radius:999px;font-weight:600;font-size:14px">6–7 Y</a></li>
            <li><a href="menu-mobile.html" style="padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border:1px solid #E6E6E6;border-radius:999px;font-weight:600;font-size:14px">8–9 Y</a></li>
            <li><a href="menu-mobile.html" style="padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border:1px solid #E6E6E6;border-radius:999px;font-weight:600;font-size:14px">10–12 Y</a></li>
          </ul>
        </div>
      </li>
      <li><button type="button" class="row" aria-expanded="false">Boys <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></li>
      <li><a class="row" href="menu-mobile.html">Sale</a></li>
    </ul>
  </nav>

  <div style="padding:20px;border-top:1px solid #E6E6E6;display:flex;gap:24px;font-size:14px;font-weight:600">
    <a href="menu-mobile.html" style="padding:10px 0">Account</a>
    <a href="menu-mobile.html" style="padding:10px 0">Search</a>
    <a href="menu-mobile.html" style="padding:10px 0">Size guide</a>
  </div>
</div>
</body>
</html>
