<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Image Lightbox</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
p,ul{margin:0;padding:0}ul{list-style:none}
.ib{width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.25)}
.th{width:64px;height:80px;background:#4D4D4D;border:2px solid transparent;box-sizing:border-box;cursor:pointer;display:block;padding:0}
.th[aria-current="true"]{border-color:#fff}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
<div role="dialog" aria-modal="true" aria-label="Product images" style="width:1440px;height:860px;background:#000;position:relative">
  <p style="position:absolute;top:28px;left:40px;font-size:14px">2 / 3 · The Floral Summer Dress</p>
  <button type="button" class="ib" aria-label="Close images" style="position:absolute;top:20px;right:32px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button type="button" class="ib" aria-label="Previous image" style="position:absolute;top:50%;left:40px;transform:translateY(-50%)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
  <button type="button" class="ib" aria-label="Next image" style="position:absolute;top:50%;right:40px;transform:translateY(-50%)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  <figure style="margin:0;position:absolute;top:72px;bottom:130px;left:50%;transform:translateX(-50%);width:560px;background:#2B2B2B;display:flex;align-items:flex-end;padding:16px;box-sizing:border-box;font-size:12px;color:#BDBDBD">Detail · fabric (zoomable)</figure>
  <ul style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px"><li><button type="button" class="th" aria-label="Image 1"></button></li><li><button type="button" class="th" aria-label="Image 2" aria-current="true"></button></li><li><button type="button" class="th" aria-label="Image 3"></button></li></ul>
</div>
</body>
</html>
