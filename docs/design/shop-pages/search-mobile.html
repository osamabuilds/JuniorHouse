<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Search Mobile</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3,p,ul,ol,figure{margin:0;padding:0}ul,ol{list-style:none}a{color:inherit;text-decoration:none}
.ph{background:#F2F2F2;margin:0;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:11px;color:#4D4D4D}
.chip{display:inline-flex;align-items:center;white-space:nowrap;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #E6E6E6;background:#fff;font:inherit;font-weight:600;font-size:14px;color:#000}
.chip[aria-pressed="true"]{background:#000;color:#fff;border-color:#000}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:3px}
</style>
<div style="width:100%;max-width:480px;margin:0 auto">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 12px 8px 4px;border-bottom:1px solid #E6E6E6">
    <a href="../core-pages/home-mobile.html" aria-label="Back" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
    <form role="search" aria-label="Search the shop" style="flex:1"><label for="q" style="position:absolute;left:-9999px">Search</label><input id="q" type="search" value="dress" style="width:100%;min-height:48px;padding:0 14px;border:1px solid #000;border-radius:2px;font:inherit;box-sizing:border-box"></form>
  </header>
  <main style="padding:0 20px 64px">
    <div style="padding:24px 0 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h1 style="font-size:30px;line-height:1.05;font-weight:600;letter-spacing:-.03em">Results for “dress”</h1><p style="color:#4D4D4D;font-size:14px;white-space:nowrap">12 pieces</p></div>
    <ul style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px 24px;padding:0 20px"><li><button type="button" class="chip" aria-pressed="true">All</button></li><li><button type="button" class="chip" aria-pressed="false">Girls</button></li><li><button type="button" class="chip" aria-pressed="false">Boys</button></li><li><button type="button" class="chip" aria-pressed="false">Age</button></li><li><button type="button" class="chip" aria-pressed="false">Sort</button></li></ul>
    <ul style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px">
      <li><a href="../core-pages/product-mobile.html" style="display:block"><figure class="ph" style="aspect-ratio:3/4">Floral dress</figure><h2 style="font-size:14px;font-weight:600;padding-top:10px">The Floral Summer Dress</h2><p style="color:#4D4D4D;font-size:14px">Rs. 5,250</p></a></li>
      <li><a href="../core-pages/product-mobile.html" style="display:block"><figure class="ph" style="aspect-ratio:3/4;background:#E9E9E9">Linen shirt dress</figure><h2 style="font-size:14px;font-weight:600;padding-top:10px">The Linen Shirt Dress</h2><p style="color:#4D4D4D;font-size:14px">Rs. 5,450</p></a></li>
      <li><a href="../core-pages/product-mobile.html" style="display:block"><figure class="ph" style="aspect-ratio:3/4">Corduroy pinafore</figure><h2 style="font-size:14px;font-weight:600;padding-top:10px">The Corduroy Pinafore</h2><p style="color:#4D4D4D;font-size:14px">Rs. 4,750</p></a></li>
      <li><a href="../core-pages/product-mobile.html" style="display:block"><figure class="ph" style="aspect-ratio:3/4;background:#E9E9E9">Smock dress</figure><h2 style="font-size:14px;font-weight:600;padding-top:10px">The Smock Dress</h2><p style="color:#4D4D4D;font-size:14px">Rs. 4,950</p></a></li>
    </ul>
    <p style="margin-top:36px;text-align:center"><a href="search-mobile.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 32px;border:1px solid #000;border-radius:999px;font-weight:600;font-size:14px">Show more</a></p>
  </main>
</div>
</body>
</html>
