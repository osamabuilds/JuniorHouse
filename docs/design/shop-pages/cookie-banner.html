<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Cookie Banner</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,p{margin:0;padding:0}a{color:inherit}
.ph{background:#F2F2F2;margin:0;display:flex;align-items:flex-end;padding:16px;box-sizing:border-box;font-size:12px;color:#4D4D4D}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:3px}
</style>
<div style="width:1440px;height:800px;position:relative;overflow:hidden;background:#fff">
  <div style="position:absolute;inset:0;display:flex"><div style="flex:1;padding:96px 64px"><p style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:20px">Autumn / Winter</p><p style="font-size:80px;line-height:.98;font-weight:600;letter-spacing:-.03em">Childhood joy,<br>dressed with care.</p></div><figure class="ph" style="flex:1;background:#E9E9E9"></figure></div>
  <section role="region" aria-label="Cookie preferences" style="position:absolute;left:24px;right:24px;bottom:24px;background:#fff;border:1px solid #000;padding:24px 28px;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between">
    <div style="flex:1 1 520px;max-width:820px"><h2 style="font-size:17px;font-weight:600;margin-bottom:4px">We use cookies</h2><p style="color:#4D4D4D;font-size:14px">We use essential cookies to make the shop work, and optional ones to understand how it is used. [Cookie policy wording to be confirmed.] <a href="legal.html" style="color:#000;font-weight:600;text-decoration:underline;text-underline-offset:4px">Read more</a></p></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn" style="border:1px solid #000;background:none;color:#000">Manage</button><button type="button" class="btn" style="border:1px solid #000;background:none;color:#000">Reject optional</button><button type="button" class="btn" style="border:0;background:#D9A62E;color:#000">Accept all</button></div>
  </section>
</div>
</body>
</html>
