<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Signup</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit}
a:hover{text-decoration:underline;text-underline-offset:4px}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.field{width:100%;min-height:52px;padding:0 14px;border:1px solid #000;border-radius:2px;background:#fff;font:inherit;color:#000;box-sizing:border-box}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:56px;width:100%;border:0;border-radius:999px;font:inherit;font-weight:600;font-size:15px;background:#D9A62E;color:#000;cursor:pointer}
.pill:hover{background:#B07C1A;color:#fff}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:400;margin:0;min-height:44px;padding:10px 0;box-sizing:border-box}
.check input{width:20px;height:20px;accent-color:#000;margin:2px 0 0;flex:none}
.hint{font-size:13px;color:#4D4D4D;margin-top:8px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:3px}
</style>
<div style="width:100%;min-height:1000px;display:flex;flex-wrap:wrap">
  <aside style="flex:1 1 480px;background:#000;color:#fff;padding:48px 64px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;min-height:360px">
    <a href="../../../README.md" style="font-size:30px;font-weight:600;letter-spacing:-.04em;color:#fff;text-decoration:none">romp kids</a>
    <div>
      <p class="eyebrow" style="color:#D9A62E;margin-bottom:20px">Create an account</p>
      <p style="font-size:clamp(32px,3.6vw,52px);line-height:1.05;font-weight:600;letter-spacing:-.03em;max-width:480px;margin-bottom:32px">Shop faster, sized right for every child.</p>
      <ul style="display:grid;gap:12px;font-size:15px;color:#E6E6E6">
        <li>Save sizes for each child</li>
        <li>Track your orders</li>
        <li>Check out in fewer steps</li>
      </ul>
    </div>
    <p style="font-size:13px;color:#BDBDBD">© Romp Kids</p>
  </aside>

  <main style="flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:48px 24px;box-sizing:border-box">
    <section aria-labelledby="t" style="width:100%;max-width:440px">
      <h1 id="t" style="font-size:44px;line-height:1;font-weight:600;letter-spacing:-.03em;margin-bottom:12px">Create account</h1>
      <p style="color:#4D4D4D;margin-bottom:36px">Already have one? <a href="login.html" style="color:#000;font-weight:600;text-decoration:underline;text-underline-offset:4px">Sign in</a></p>

      <form style="display:grid;gap:22px" aria-label="Create account">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px">
          <div><label for="fn">First name</label><input id="fn" class="field" type="text" autocomplete="given-name"></div>
          <div><label for="ln">Last name</label><input id="ln" class="field" type="text" autocomplete="family-name"></div>
        </div>
        <div><label for="e">Email address</label><input id="e" class="field" type="email" autocomplete="email"></div>
        <div><label for="m">Mobile number</label><input id="m" class="field" type="tel" autocomplete="tel" placeholder="03XX XXXXXXX"><p class="hint">Used only for delivery updates.</p></div>
        <div>
          <label for="p">Password</label>
          <div style="position:relative"><input id="p" class="field" type="password" autocomplete="new-password" aria-describedby="ph" style="padding-right:76px"><button type="button" aria-label="Show password" style="position:absolute;right:4px;top:4px;height:44px;padding:0 12px;border:0;background:none;font:inherit;font-weight:600;font-size:13px;color:#000;cursor:pointer">Show</button></div>
          <p id="ph" class="hint">[Password rules to be confirmed]</p>
        </div>
        <div>
          <label class="check"><input type="checkbox" required> <span>I agree to the <a href="#" style="color:#000">Terms</a> and <a href="#" style="color:#000">Privacy policy</a>.</span></label>
          <label class="check"><input type="checkbox"> <span>Send me notes on new arrivals (optional).</span></label>
        </div>
        <button type="submit" class="pill">Create account</button>
      </form>
    </section>
  </main>
</div>
</body>
</html>
