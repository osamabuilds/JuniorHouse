<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Romp Check Your Email Mobile</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#000;font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55}
h1,p{margin:0;padding:0}
a{color:inherit}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:56px;width:100%;border:1px solid #000;border-radius:999px;font:inherit;font-weight:600;font-size:15px;background:none;color:#000}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:3px}
</style>
<div style="width:100%;max-width:480px;margin:0 auto">
  <header style="display:flex;align-items:center;justify-content:center;padding:14px 20px;border-bottom:1px solid #E6E6E6"><a href="../core-pages/home.html" style="font-size:26px;font-weight:600;letter-spacing:-.04em;text-decoration:none">romp kids</a></header>
  <main style="padding:40px 20px 56px">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-bottom:24px"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/></svg>
    <h1 style="font-size:40px;line-height:1;font-weight:600;letter-spacing:-.03em;margin-bottom:16px">Check your email</h1>
    <p role="status" style="color:#4D4D4D;margin-bottom:12px">If an account exists for that email address, a reset link is on its way. The link works for [X] minutes.</p>
    <p style="color:#4D4D4D;margin-bottom:32px">Nothing in your inbox? Check your spam folder.</p>
    <button type="button" class="pill">Resend email</button>
    <p style="margin-top:12px;font-size:13px;color:#4D4D4D;text-align:center">You can resend in [X] seconds.</p>
    <p style="margin-top:28px;padding-top:20px;border-top:1px solid #E6E6E6"><a href="login-mobile.html" style="font-weight:600;text-decoration:underline;text-underline-offset:4px;padding:10px 0;display:inline-block">← Back to sign in</a></p>
  </main>
</div>
</body>
</html>
