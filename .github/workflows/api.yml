name: api

on:
  push:
    branches: [main]
    paths: ["src/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["src/api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: src/api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Romp.slnx
      - run: dotnet build Romp.slnx --no-restore -c Release
      - run: dotnet test Romp.slnx --no-build -c Release

      # SEC-23: fail on critical-severity vulnerable NuGet packages.
      - name: Vulnerable package check
        run: |
          dotnet list Romp.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "Critical" vulnerable.txt; then
            echo "::error::Critical vulnerable NuGet package found"
            exit 1
          fi

  image-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f src/Romp.Api/Dockerfile -t romp-api:${{ github.sha }} .
      # SEC-24: scan the container image before it can be deployed.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: romp-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
