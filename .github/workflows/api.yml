name: api

on:
  push:
    branches: [main]
    paths: ["src/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["src/api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: src/api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Romp.slnx
      - run: dotnet build Romp.slnx --no-restore -c Release
      - run: dotnet test Romp.slnx --no-build -c Release

      # SEC-23: fail on critical-severity vulnerable NuGet packages.
      - name: Vulnerable package check
        run: |
          dotnet list Romp.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "Critical" vulnerable.txt; then
            echo "::error::Critical vulnerable NuGet package found"
            exit 1
          fi

  image-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f src/Romp.Api/Dockerfile -t romp-api:${{ github.sha }} .
      # SEC-24: scan the container image before it can be deployed.
      # Trivy is installed straight from its GitHub release and checked against the published checksum. aquasecurity/trivy-action
      # fetches the binary from get.trivy.dev, which stopped resolving (curl exit 6), so the action is not used.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan image
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 romp-api:${{ github.sha }}
