# Local development stack. Production runs on VPS nodes behind Cloudflare (BRD §9.4, §13.8).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-romp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-romp}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Captures outbound email locally so notification flows can be tested (UI on :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: src/api
      dockerfile: src/Romp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB:-romp};Username=${POSTGRES_USER:-romp};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      # SCRUM-175 "Try Sprint 1": a few sample styles/vendors, so the demo isn't an empty admin app.
      # Idempotent (DemoDataSeeder) - safe to leave on every `docker compose up`.
      Demo__SeedSampleData: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: src/web
      dockerfile: Dockerfile.admin
    environment:
      # The browser (on the host, not in the Docker network) reaches the API through the port
      # mapping above, so this is localhost:8080, not the api service's in-network hostname.
      API_BASE_URL: http://localhost:8080
    ports:
      - "4201:80"
    depends_on:
      - api

  storefront:
    build:
      context: src/web
      dockerfile: Dockerfile.storefront
    ports:
      - "4000:4000"
    depends_on:
      - api

volumes:
  postgres-data:
