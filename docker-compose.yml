# Local development stack. Production runs on VPS nodes behind Cloudflare (BRD §9.4, §13.8).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-romp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-romp}
    ports:
      # Host-side 5433: a native PostgreSQL install commonly claims 5432 on Windows dev
      # machines, and Docker's own port-forwarding silently loses that race. Containers
      # still reach this over the internal docker network at postgres:5432, unaffected.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Captures outbound email locally so notification flows can be tested (UI on :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: src/api
      dockerfile: src/Romp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB:-romp};Username=${POSTGRES_USER:-romp};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      # SCRUM-175 "Try Sprint 1": a few sample styles/vendors, so the demo isn't an empty admin app.
      # Idempotent (DemoDataSeeder) - safe to leave on every `docker compose up`.
      Demo__SeedSampleData: "true"
      # Sprint 3 (SCRUM-183): production tracking settings. These are the defaults, listed so they are easy to find and change.
      # A milestone recorded more than this many days after its claimed date is shown as "recorded late".
      Prod__RecordedLateDays: "3"
      # A run is "at risk" when its expected completion is later than the latest acceptable delivery date minus this many days.
      Prod__AtRiskBufferDays: "7"
      # Sprint 4 (SCRUM-197): receiving and QC settings. These are the defaults, listed so they are easy to find and change.
      # A batch of this many pieces or fewer is inspected 100%; larger ones by AQL sampling.
      Qc__FullInspectionMaxLot: "50"
      # The inspection level (I, II, III) and the acceptable quality level the sampling plan applies unless a form says otherwise.
      Qc__DefaultInspectionLevelCode: "II"
      Qc__DefaultAqlLevelCode: "Aql2_5"
      # Critical defects allowed in a sample before it fails (0: any critical defect fails).
      Qc__CriticalDefectTolerance: "0"
      # The vendor scorecard also shows this rolling window next to the all-time figures.
      Vndr__Scorecard__WindowDays: "90"
    volumes:
      - po-files:/data/po-files
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: src/web
      dockerfile: Dockerfile.admin
    environment:
      # Empty: the browser calls the admin origin itself (the API port mapping above is no longer used by the admin app).
      API_BASE_URL: ""
      # nginx in the admin container forwards /api to the API service, so the browser talks to one origin (sessions G9).
      API_UPSTREAM: http://api:8080
    ports:
      - "4201:80"
    depends_on:
      - api

  storefront:
    build:
      context: src/web
      dockerfile: Dockerfile.storefront
      args:
        # development keeps the dev-only /_foundations design page; the CD pipeline builds production
        NG_CONFIGURATION: development
    environment:
      # The SSR server forwards /api/storefront/* (published settings and pages) to the API inside the Docker network.
      API_BASE_URL: http://api:8080
    ports:
      - "4000:4000"
    depends_on:
      - api

volumes:
  postgres-data:
  po-files:
