# Sprint 8 (secure): the same local stack with real staff sign-in instead of the development stand-in user.
#
#   docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d --build
#
# Create the first Owner once (see "Try Sprint 8" in the README). Plain-HTTP cookies are allowed here only because this is a local stack
# on localhost; the host refuses that setting anywhere else. To go back to the open stack, start with docker-compose.yml alone.
services:
  api:
    environment:
      Identity__UseRealAuthentication: "true"
      Identity__AllowInsecureCookies: "true"
      # Customer sign-in (accounts S11): real sessions on the storefront origin; mail goes to Mailpit (UI on :8025).
      Customers__Auth__UseRealSignIn: "true"
      Customers__Auth__AllowInsecureCookies: "true"
      Customers__PublicBaseUrl: http://localhost:4000
      # The storefront address: the basket and sign-in writes check the browser Origin against it (cart C7).
      Site__PublicBaseUrl: http://localhost:4000
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__FromAddress: no-reply@romp.local
