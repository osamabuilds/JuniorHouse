server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Regenerated per container start (docker-entrypoint-env.sh) - never cache it.
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files /env.js =404;
    }

    # Same-origin API (sessions G9): the browser talks to this origin only, so the session cookies are first-party and no CORS
    # is involved. The Host header is kept, so the API sees the origin the browser used (its Origin check compares against it).
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (Angular Router uses path-based URLs, not hash) - any unmatched path
    # falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
