@if (!chromeless()) {
  <header class="shell-header">
    <div class="shell-header__brand">
      <span class="shell-header__mark" aria-hidden="true">R</span>
      <span class="shell-header__title">Romp <span class="shell-header__title-muted">Admin</span></span>
    </div>

    <nav class="shell-nav" aria-label="Primary">
      <ul>
        <li><a routerLink="/reference-data" routerLinkActive="is-active">Reference Data</a></li>
        <li><a routerLink="/styles" routerLinkActive="is-active">Styles</a></li>
        <li><a routerLink="/catalog" routerLinkActive="is-active">Catalog</a></li>
        <li><a routerLink="/vendors" routerLinkActive="is-active">Vendors</a></li>
        <li><a routerLink="/purchase-orders" routerLinkActive="is-active">Purchase Orders</a></li>
        <li><a routerLink="/production" routerLinkActive="is-active">Production</a></li>
        <li><a routerLink="/quality" routerLinkActive="is-active">Receiving &amp; QC</a></li>
        <li><a routerLink="/labelling" routerLinkActive="is-active">Labelling</a></li>
        <li><a routerLink="/warehouse" routerLinkActive="is-active">Warehouse</a> <app-alert-badge /></li>
      </ul>
    </nav>
  </header>
}

<main class="shell-main">
  <router-outlet />
</main>

@if (!chromeless()) {
  <footer class="shell-footer">
    <p>Romp Admin &middot; Sprint 7 (Publish)</p>
    <app-outbox-health [health]="outboxHealth()" />
  </footer>
}
