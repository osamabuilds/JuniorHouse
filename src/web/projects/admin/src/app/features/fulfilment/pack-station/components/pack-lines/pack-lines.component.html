<table class="table">
  <caption class="sr-only">Items to put in the parcel</caption>
  <thead>
    <tr>
      <th scope="col">Item</th>
      <th scope="col">Size</th>
      <th scope="col">Colour</th>
      <th scope="col" class="num">In the parcel</th>
      <th scope="col">State</th>
    </tr>
  </thead>
  <tbody>
    @for (line of lines(); track line.lineId) {
      <tr>
        <th scope="row" data-label="Item">{{ line.name }} <small>{{ line.sku }}</small></th>
        <td data-label="Size">{{ line.size }}</td>
        <td data-label="Colour">{{ line.colour }}</td>
        <td data-label="In the parcel" class="num">{{ line.packed }} of {{ line.quantity }}</td>
        <td data-label="State">{{ isDone(line) ? 'Done' : 'Scan it' }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Nothing to pack.</td>
      </tr>
    }
  </tbody>
</table>
