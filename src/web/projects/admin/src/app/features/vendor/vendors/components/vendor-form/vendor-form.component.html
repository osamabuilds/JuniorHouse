<form class="vendor-form card" (ngSubmit)="submitted.emit()" [formGroup]="form()">
  <h2>{{ mode() === 'create' ? 'Add' : 'Edit' }} vendor</h2>

  @if (error()) {
    <p class="banner banner--error" role="alert">{{ error()?.message }}</p>
  }

  <div class="form-grid">
    <div class="form-field form-field--wide">
      <label for="vendor-name">Name</label>
      <input id="vendor-name" type="text" formControlName="name" />
      <app-control-errors [control]="form().controls.name" label="Name" kind="enter" />
      <app-field-errors [messages]="fieldErrors('Name')" />
    </div>

    <div class="form-field">
      <label for="vendor-contact-name">Contact name</label>
      <input id="vendor-contact-name" type="text" formControlName="contactName" />
      <app-control-errors [control]="form().controls.contactName" label="Contact name" kind="enter" />
      <app-field-errors [messages]="fieldErrors('ContactName')" />
    </div>

    <div class="form-field">
      <label for="vendor-contact-phone">Contact phone</label>
      <input id="vendor-contact-phone" type="tel" formControlName="contactPhone" />
      <app-control-errors [control]="form().controls.contactPhone" label="Contact phone" kind="enter" />
      <app-field-errors [messages]="fieldErrors('ContactPhone')" />
    </div>

    <div class="form-field form-field--wide">
      <label for="vendor-contact-email">Contact email</label>
      <input id="vendor-contact-email" type="email" formControlName="contactEmail" />
      <app-control-errors [control]="form().controls.contactEmail" label="Contact email" kind="enter" />
      <app-field-errors [messages]="fieldErrors('ContactEmail')" />
    </div>

    <div class="form-field">
      <label for="vendor-city">City</label>
      <select id="vendor-city" formControlName="cityId">
        <option [value]="null">Select…</option>
        @for (city of cities(); track city.id) {
          <option [value]="city.id">{{ city.name }}</option>
        }
      </select>
      <app-control-errors [control]="form().controls.cityId" label="City" kind="choose" />
    </div>

    <div class="form-field">
      <label for="vendor-payment-term">Default payment term</label>
      <select id="vendor-payment-term" formControlName="paymentTermId">
        <option [value]="null">Select…</option>
        @for (term of paymentTerms(); track term.id) {
          <option [value]="term.id">{{ term.name }}</option>
        }
      </select>
      <app-control-errors [control]="form().controls.paymentTermId" label="Default payment term" kind="choose" />
    </div>

    @if (mode() === 'edit') {
      <div class="form-field">
        <label class="toolbar__checkbox" for="vendor-active">
          <input id="vendor-active" type="checkbox" formControlName="isActive" />
          Active
        </label>
      </div>
    }
  </div>

  <fieldset class="picker">
    <legend>Specialisations</legend>
    @for (specialisation of specialisations(); track specialisation.id) {
      <label class="picker__option">
        <input
          type="checkbox"
          [checked]="selectedSpecialisationIds().includes(specialisation.id)"
          (change)="onSpecialisationToggle(specialisation.id, $event)"
        />
        {{ specialisation.name }}
      </label>
    }
  </fieldset>
  <app-field-errors [messages]="fieldErrors('SpecialisationIds')" />

  <div class="form-actions">
    <button type="submit" class="button button--primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <button type="button" class="button" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
