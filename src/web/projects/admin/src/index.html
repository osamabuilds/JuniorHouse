<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Romp Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Admin app-wide (plan.md): never indexed, this is the back office, not the storefront. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Runtime config, read by API_BASE_URL (core/api-base-url.token.ts) - loaded before the
         Angular bundle so the same build can point at a different API per environment. -->
    <script src="env.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
