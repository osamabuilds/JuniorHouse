@if (tiles().length > 0) {
  <section class="rp-section rp-section--tight" [attr.aria-labelledby]="headingId()">
    <div class="rp-wrap">
      <div class="rp-head">
        <div>
          @if (eyebrow(); as text) {
            <span class="rp-eyebrow">{{ text }}</span>
          }
          <h2 [id]="headingId()" class="rp-display-md">{{ heading() }}</h2>
        </div>
        @if (overflows()) {
        <div class="rp-arrows">
          <button class="rp-arrow" type="button" aria-label="Previous" [disabled]="!canPrev()" (click)="scroll(-1)"><rp-icon name="arrow-left" /></button>
          <button class="rp-arrow" type="button" aria-label="Next" [disabled]="!canNext()" (click)="scroll(1)"><rp-icon name="arrow" /></button>
        </div>
        }
      </div>
      <ul #rail class="rp-rail" tabindex="0" [attr.aria-label]="heading()">
        @for (tile of tiles(); track tile.productId) {
          <li [attr.data-product-id]="tile.productId">
            <rp-product-tile [tile]="tile" (quickAdded)="added.emit(tile.productId)" />
          </li>
        }
      </ul>
    </div>
  </section>
}
