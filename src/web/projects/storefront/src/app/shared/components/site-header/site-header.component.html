<p class="announce">Nationwide delivery · Size guide on every piece</p>

<header class="bar page">
  <button
    type="button"
    class="icon-btn menu-btn"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="primary-nav"
    aria-label="Menu"
    (click)="toggleMenu()"
  >
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M4 8h16M4 16h16" />
    </svg>
  </button>

  <a routerLink="/" class="logo" aria-label="Romp Kids, home">romp kids</a>

  <nav id="primary-nav" class="nav" [class.open]="menuOpen()" aria-label="Primary">
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">{{
            link.label
          }}</a>
        </li>
      }
    </ul>
  </nav>

  <div class="actions">
    <button type="button" class="icon-btn" aria-label="Search">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-4-4" />
      </svg>
    </button>
    <button type="button" class="icon-btn account-btn" aria-label="Account">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c1-4 4-6 8-6s7 2 8 6" />
      </svg>
    </button>
    <button type="button" class="icon-btn" aria-label="Bag, 0 items">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
    </button>
  </div>
</header>
