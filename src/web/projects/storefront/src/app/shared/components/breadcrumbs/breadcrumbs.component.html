<nav aria-label="Breadcrumb">
  <ol>
    <li><a routerLink="/">Home</a></li>
    @for (item of items(); track item.label) {
      <li aria-hidden="true">/</li>
      <li>
        @if (item.link) {
          <a [routerLink]="item.link">{{ item.label }}</a>
        } @else {
          <span aria-current="page">{{ item.label }}</span>
        }
      </li>
    }
  </ol>
</nav>
